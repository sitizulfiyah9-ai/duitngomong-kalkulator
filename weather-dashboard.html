<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .search-container {
            display: flex;
            gap: 10px;
            max-width: 500px;
            margin: 0 auto 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            font-size: 1em;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            transform: scale(1.05);
            background: white;
        }

        .search-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            background: white;
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            font-size: 1em;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .message {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .error {
            background: #ff6b6b;
            color: white;
        }

        .success {
            background: #51cf66;
            color: white;
        }

        .loading {
            text-align: center;
            color: white;
            padding: 40px;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .main-weather {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .location-info h2 {
            font-size: 2em;
            color: #333;
            margin-bottom: 5px;
        }

        .location-info p {
            color: #666;
            font-size: 1.1em;
        }

        .weather-main {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .weather-icon {
            font-size: 6em;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .temperature-info {
            flex: 1;
        }

        .temperature {
            font-size: 4em;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 10px;
        }

        .condition {
            font-size: 1.5em;
            color: #666;
            margin-bottom: 10px;
            text-transform: capitalize;
        }

        .feels-like {
            color: #999;
            font-size: 1.1em;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .detail-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
        }

        .detail-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .detail-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-value {
            font-size: 1.8em;
            font-weight: 700;
        }

        .detail-icon {
            font-size: 1.5em;
            margin-bottom: 8px;
        }

        .forecast {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .forecast-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .forecast-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
        }

        .forecast-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .forecast-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .forecast-temp {
            font-size: 1.3em;
            color: #667eea;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .forecast-condition {
            color: #666;
            font-size: 0.95em;
            text-transform: capitalize;
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .no-data i {
            font-size: 5em;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .no-data p {
            font-size: 1.3em;
        }

        .units-toggle {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }

        .unit-btn {
            padding: 8px 20px;
            border: 2px solid #667eea;
            background: transparent;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .unit-btn.active {
            background: white;
            color: #667eea;
        }

        .unit-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .main-weather {
                padding: 20px;
            }

            .weather-main {
                flex-direction: column;
                text-align: center;
            }

            .temperature {
                font-size: 3em;
            }

            .weather-icon {
                font-size: 4em;
            }

            .weather-header {
                flex-direction: column;
            }

            .search-container {
                flex-direction: column;
            }

            .search-box {
                min-width: 100%;
            }

            .search-btn {
                min-width: 100%;
            }
        }

        .last-updated {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
            margin-top: 20px;
        }

        .refresh-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .refresh-btn:hover {
            background: white;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌤️ Weather Dashboard</h1>
        <p>Get real-time weather information</p>
    </div>

    <div class="container">
        <div class="search-container">
            <input 
                type="text" 
                class="search-box" 
                id="searchInput" 
                placeholder="Enter city name..." 
                autocomplete="off"
            >
            <button class="search-btn" id="searchBtn">
                <i class="fas fa-search"></i> Search
            </button>
        </div>

        <div id="messageBox"></div>

        <div class="units-toggle">
            <button class="unit-btn active" id="celsiusBtn">°C Celsius</button>
            <button class="unit-btn" id="fahrenheitBtn">°F Fahrenheit</button>
        </div>

        <div id="weatherContainer"></div>

        <div class="last-updated" id="lastUpdated"></div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const weatherContainer = document.getElementById('weatherContainer');
        const messageBox = document.getElementById('messageBox');
        const celsiusBtn = document.getElementById('celsiusBtn');
        const fahrenheitBtn = document.getElementById('fahrenheitBtn');
        const lastUpdatedDiv = document.getElementById('lastUpdated');

        let isCelsius = true;
        let currentWeatherData = null;

        const API_KEY = '40c6c8b0e60e9279c992604f91d5491'; // Free tier API key
        const BASE_URL = 'https://api.openweathermap.org/data/2.5';

        const weatherIcons = {
            '01d': '☀️',
            '01n': '🌙',
            '02d': '⛅',
            '02n': '🌥️',
            '03d': '☁️',
            '03n': '☁️',
            '04d': '☁️',
            '04n': '☁️',
            '09d': '🌧️',
            '09n': '🌧️',
            '10d': '🌧️',
            '10n': '🌧️',
            '11d': '⛈️',
            '11n': '⛈️',
            '13d': '❄️',
            '13n': '❄️',
            '50d': '🌫️',
            '50n': '🌫️'
        };

        function showMessage(text, type = 'error') {
            messageBox.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => {
                messageBox.innerHTML = '';
            }, 5000);
        }

        function getWeatherIcon(iconCode) {
            return weatherIcons[iconCode] || '🌤️';
        }

        function convertTemperature(kelvin, toCelsius = true) {
            if (toCelsius) {
                return Math.round(kelvin - 273.15);
            } else {
                return Math.round((kelvin - 273.15) * 9/5 + 32);
            }
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp * 1000);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp * 1000);
            return date.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
        }

        async function fetchWeather(city) {
            weatherContainer.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading weather data...</p></div>';
            messageBox.innerHTML = '';

            try {
                // Fetch current weather
                const weatherResponse = await fetch(
                    `${BASE_URL}/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}`
                );

                if (!weatherResponse.ok) {
                    if (weatherResponse.status === 404) {
                        throw new Error('City not found. Please try another search.');
                    }
                    throw new Error('Failed to fetch weather data');
                }

                const weatherData = await weatherResponse.json();

                // Fetch forecast
                const forecastResponse = await fetch(
                    `${BASE_URL}/forecast?q=${encodeURIComponent(city)}&appid=${API_KEY}`
                );

                const forecastData = await forecastResponse.json();

                currentWeatherData = { weather: weatherData, forecast: forecastData };
                displayWeather(weatherData, forecastData);
                showMessage(`✓ Weather data for ${weatherData.name} loaded!`, 'success');
                updateLastUpdated();

            } catch (error) {
                weatherContainer.innerHTML = `
                    <div class="no-data">
                        <i class="fas fa-cloud-sun-rain"></i>
                        <p>Unable to load weather data</p>
                        <p style="font-size: 0.9em; margin-top: 10px; opacity: 0.8;">${error.message}</p>
                    </div>
                `;
                showMessage(error.message, 'error');
            }
        }

        function displayWeather(weatherData, forecastData) {
            const temp = isCelsius ? 
                convertTemperature(weatherData.main.temp, true) : 
                convertTemperature(weatherData.main.temp, false);
            const feelsLike = isCelsius ?
                convertTemperature(weatherData.main.feels_like, true) :
                convertTemperature(weatherData.main.feels_like, false);

            const unitSymbol = isCelsius ? '°C' : '°F';

            const mainHTML = `
                <div class="main-weather">
                    <div class="weather-header">
                        <div class="location-info">
                            <h2>${weatherData.name}, ${weatherData.sys.country}</h2>
                            <p>${formatDate(weatherData.dt)}</p>
                        </div>
                        <button class="refresh-btn" onclick="location.reload()">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                    </div>

                    <div class="weather-main">
                        <div class="weather-icon">${getWeatherIcon(weatherData.weather[0].icon)}</div>
                        <div class="temperature-info">
                            <div class="temperature">${temp}${unitSymbol}</div>
                            <div class="condition">${weatherData.weather[0].description}</div>
                            <div class="feels-like">Feels like ${feelsLike}${unitSymbol}</div>
                        </div>
                    </div>

                    <div class="weather-details">
                        <div class="detail-card">
                            <div class="detail-icon">💧</div>
                            <div class="detail-label">Humidity</div>
                            <div class="detail-value">${weatherData.main.humidity}%</div>
                        </div>
                        <div class="detail-card">
                            <div class="detail-icon">💨</div>
                            <div class="detail-label">Wind Speed</div>
                            <div class="detail-value">${weatherData.wind.speed} m/s</div>
                        </div>
                        <div class="detail-card">
                            <div class="detail-icon">🔽</div>
                            <div class="detail-label">Pressure</div>
                            <div class="detail-value">${weatherData.main.pressure} hPa</div>
                        </div>
                        <div class="detail-card">
                            <div class="detail-icon">👁️</div>
                            <div class="detail-label">Visibility</div>
                            <div class="detail-value">${(weatherData.visibility / 1000).toFixed(1)} km</div>
                        </div>
                        <div class="detail-card">
                            <div class="detail-icon">⬆️</div>
                            <div class="detail-label">Max Temp</div>
                            <div class="detail-value">${isCelsius ? convertTemperature(weatherData.main.temp_max, true) : convertTemperature(weatherData.main.temp_max, false)}${unitSymbol}</div>
                        </div>
                        <div class="detail-card">
                            <div class="detail-icon">⬇️</div>
                            <div class="detail-label">Min Temp</div>
                            <div class="detail-value">${isCelsius ? convertTemperature(weatherData.main.temp_min, true) : convertTemperature(weatherData.main.temp_min, false)}${unitSymbol}</div>
                        </div>
                    </div>
                </div>
            `;

            // Process forecast - get daily forecasts
            const dailyForecasts = {};
            forecastData.list.forEach(item => {
                const date = formatDate(item.dt);
                if (!dailyForecasts[date]) {
                    dailyForecasts[date] = {
                        date: date,
                        temp: isCelsius ? convertTemperature(item.main.temp, true) : convertTemperature(item.main.temp, false),
                        icon: item.weather[0].icon,
                        description: item.weather[0].description,
                        dt: item.dt
                    };
                }
            });

            const forecastHTML = `
                <div style="margin-top: 30px;">
                    <h3 style="color: white; margin-bottom: 20px; font-size: 1.5em;">
                        <i class="fas fa-calendar-alt"></i> 5-Day Forecast
                    </h3>
                    <div class="forecast">
                        ${Object.values(dailyForecasts).slice(1, 6).map(day => `
                            <div class="forecast-card">
                                <div class="forecast-title">${day.date}</div>
                                <div class="forecast-icon">${getWeatherIcon(day.icon)}</div>
                                <div class="forecast-temp">${day.temp}${unitSymbol}</div>
                                <div class="forecast-condition">${day.description}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            weatherContainer.innerHTML = mainHTML + forecastHTML;
        }

        function updateLastUpdated() {
            const now = new Date();
            lastUpdatedDiv.textContent = `Last updated: ${now.toLocaleTimeString()}`;
        }

        function toggleUnits() {
            isCelsius = !isCelsius;
            celsiusBtn.classList.toggle('active');
            fahrenheitBtn.classList.toggle('active');
            if (currentWeatherData) {
                displayWeather(currentWeatherData.weather, currentWeatherData.forecast);
            }
        }

        async function handleSearch() {
            const city = searchInput.value.trim();
            if (city) {
                await fetchWeather(city);
                searchInput.value = '';
            } else {
                showMessage('Please enter a city name', 'error');
            }
        }

        searchBtn.addEventListener('click', handleSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });

        celsiusBtn.addEventListener('click', toggleUnits);
        fahrenheitBtn.addEventListener('click', toggleUnits);

        // Load default city on page load
        window.addEventListener('load', () => {
            fetchWeather('London');
        });
    </script>
</body>
</html>
